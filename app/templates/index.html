<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pachat</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <h1>Pachat</h1>
        <button id="new-chat" class="secondary-button">New chat</button>
        <div class="status-box">
          <strong>Status</strong>
          <span id="status-indicator">Ready</span>
        </div>
      </aside>

      <section class="chat-panel">
        <form id="upload-form" class="intake-form">
          <label for="document-files">Add case documents</label>
          <div class="intake-controls">
            <input id="document-files" name="files" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.png,.tif,.txt,.rtf,.md,.markdown,.csv,.tsv,.log,.json,.xml,.yaml,.yml,.zip,text/*,image/*" />
            <button type="submit" id="upload-button">Upload</button>
          </div>
          <p id="upload-status" aria-live="polite">PDF, Office, image, and text files are accepted. ZIP archives are unpacked before scanning.</p>
          <ul id="upload-results" aria-live="polite"></ul>
        </form>
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="composer">
          <textarea
            id="prompt"
            rows="3"
            placeholder="Ask the model anything…"
            aria-label="User message"
          ></textarea>
          <button type="submit" id="send-button">Send</button>
        </form>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
